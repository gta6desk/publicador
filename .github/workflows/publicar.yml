name: publicar
# Horas de Lisboa (= UTC de novembro a março; em horário de verão tirar 1 hora a cada cron).
# O GitHub atrasa ou descarta agendamentos à hora certa (27/10 não correu). Por isso:
# Stories: 13:07 publica, 13:22 2.ª tentativa, 13:47 vigia. Posts: 19:07, 19:22, vigia 19:47.
# O registo impede repetir; a vigia não publica, só dá erro (email) se o de hoje não saiu.
on:
  schedule:
    - cron: "7 13 * * *"
    - cron: "22 13 * * *"
    - cron: "47 13 * * *"
    - cron: "7 19 * * *"
    - cron: "22 19 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não publica)"
        type: boolean
        default: true
      verificar:
        description: "Só verificar a chave (não publica)"
        type: boolean
        default: false

permissions:
  contents: write   # para guardar o registo.csv

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pillow
      - name: Testes (se falharem, não publica)
        run: pytest -q
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "47 13 * * *" ] || [ "${{ github.event.schedule }}" = "47 19 * * *" ]; then
            python publicar.py --vigiar
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.verificar }}" = "true" ]; then
            python publicar.py --verificar
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.simular }}" = "true" ]; then
            python publicar.py --simular
          else
            python publicar.py
          fi
      - name: Guardar registo
        if: always()
        run: |
          git config user.name "publicador-gta6desk"
          git config user.email "actions@users.noreply.github.com"
          git add registo.csv
          git diff --cached --quiet || (git commit -m "registo: $(date -u +%F)" && git push)
