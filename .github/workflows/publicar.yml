name: publicar
# Horas de Lisboa (= UTC de novembro a março; em horário de verão tirar 1 hora a cada cron).
# Quem dispara a horas é o cron-job.org: 13:07, 13:37, 17:07, 17:37, 23:07, 23:37 de Lisboa (desde 29/10 16:50).
# 2 posts por dia (17:00 e 23:30 na fila) desde 29/10: pedido do Rodri, ok do João.
# Os agendamentos abaixo ficam de reserva: o GitHub atrasa-os horas (27 e 28/10), mas acabam por correr.
# O registo impede repetir; a vigia não publica, só dá erro (email) se o de hoje não saiu.
# Antes de publicar, o agendador acerta a fila com a mesa (posts aprovados entram; os que deixaram de estar saem).
on:
  schedule:
    - cron: "7 13 * * *"
    - cron: "22 13 * * *"
    - cron: "47 13 * * *"
    - cron: "7 17 * * *"
    - cron: "22 17 * * *"
    - cron: "47 17 * * *"
    - cron: "37 23 * * *"
    - cron: "52 23 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não publica)"
        type: boolean
        default: true
      verificar:
        description: "Só verificar a chave (não publica)"
        type: boolean
        default: false

permissions:
  contents: write   # para guardar o registo.csv e a fila

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIGIA: ${{ github.event.schedule == '47 13 * * *' || github.event.schedule == '47 17 * * *' }}
      VERIFICAR: ${{ github.event_name == 'workflow_dispatch' && inputs.verificar }}
      SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pillow
      - name: Agendador (mesa só de leitura → fila)
        if: env.VIGIA != 'true' && env.VERIFICAR != 'true'
        env:
          MESA_TOKEN: ${{ secrets.MESA_TOKEN }}
        run: |
          if [ -z "$MESA_TOKEN" ]; then echo "Sem MESA_TOKEN: agendador desligado, a fila fica como está."; exit 0; fi
          git clone -q "https://x-access-token:${MESA_TOKEN}@github.com/gta6desk/mesa" ../mesa
          if [ "$SIMULAR" = "true" ]; then opc="--simular"; else opc=""; fi
          if ! python agendar.py --mesa ../mesa $opc; then
            echo "::warning::O agendador falhou: a fila fica como estava e publica-se o que já lá estava."
            git checkout -- fila.json; git clean -fdq posts/
            echo "AGENDAR_FALHOU=1" >> "$GITHUB_ENV"
          fi
      - name: Testes (se falharem, não publica)
        run: |
          if ! pytest -q; then
            if git diff --quiet -- fila.json; then exit 1; fi
            echo "::warning::Os testes falharam com a fila nova do agendador; volto à fila anterior."
            git checkout -- fila.json; git clean -fdq posts/
            echo "AGENDAR_FALHOU=1" >> "$GITHUB_ENV"
            pytest -q
          fi
      - name: Guardar fila
        if: env.SIMULAR != 'true'
        run: |
          git config user.name "publicador-gta6desk"
          git config user.email "actions@users.noreply.github.com"
          git add fila.json posts/
          git diff --cached --quiet || (git commit -m "fila: agendador $(date -u +%F' '%H:%M)" && git push)
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "$VIGIA" = "true" ]; then
            python publicar.py --vigiar
          elif [ "$VERIFICAR" = "true" ]; then
            python publicar.py --verificar
          elif [ "$SIMULAR" = "true" ]; then
            python publicar.py --simular
          else
            python publicar.py
          fi
      - name: Guardar registo
        if: always()
        run: |
          git config user.name "publicador-gta6desk"
          git config user.email "actions@users.noreply.github.com"
          git add registo.csv
          git diff --cached --quiet || (git commit -m "registo: $(date -u +%F)" && git push)
      - name: Avisar se o agendador falhou
        if: env.AGENDAR_FALHOU == '1'
        run: |
          echo "O agendador falhou nesta corrida (ver o passo 'Agendador' ou 'Testes'). Publicou-se o que já estava na fila."
          exit 1
